name: Build Richard Dashboard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/RichardDashboard-v2.zip.b64'
      - '.github/workflows/build-richard-dashboard.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/android-cmd
          mv /tmp/android-cmd/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack project
        run: |
          base64 -d android-build/RichardDashboard-v2.zip.b64 > /tmp/app.zip
          unzip -q /tmp/app.zip -d android-build/work
      - name: Replace launcher with stable WebView
        run: |
          cat > android-build/work/RichardDashboard/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Richard Dashboard"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-build/work/RichardDashboard/app/src/main/java/com/ricardobisignano/dashboard/MainActivity.kt <<'EOF'
          package com.ricardobisignano.dashboard

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.loadsImagesAutomatically = true
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  setContentView(webView)
                  if (savedInstanceState == null) {
                      webView.loadUrl("https://ricardobisignano.com.ar/dashboard.html")
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Align JVM targets
        working-directory: android-build/work/RichardDashboard
        run: sed -i 's/compileSdk = 35/compileSdk = 35; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }/' app/build.gradle.kts
      - name: Build APK
        working-directory: android-build/work/RichardDashboard
        run: gradle assembleDebug --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - name: Verify launcher
        run: |
          APK=android-build/work/RichardDashboard/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "launchable-activity"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Collect APK
        run: cp android-build/work/RichardDashboard/app/build/outputs/apk/debug/app-debug.apk RichardDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RichardDashboard-APK
          path: RichardDashboard.apk
