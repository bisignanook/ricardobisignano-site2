name: Build Richard Dashboard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/RichardDashboard-v2.zip.b64'
      - '.github/workflows/build-richard-dashboard.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack project
        run: |
          base64 -d android-build/RichardDashboard-v2.zip.b64 > /tmp/app.zip
          unzip -q /tmp/app.zip -d android-build/work
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-build/work/RichardDashboard
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: cp android-build/work/RichardDashboard/app/build/outputs/apk/debug/app-debug.apk RichardDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RichardDashboard-APK
          path: RichardDashboard.apk
