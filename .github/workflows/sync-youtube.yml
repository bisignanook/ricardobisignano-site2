name: Sync latest YouTube video

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - '.github/workflows/sync-youtube.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect latest upload and update site
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check yt-dlp
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          CHANNEL_URL = "https://www.youtube.com/@Ricardo.Bisignano/videos"

          try:
              latest_id = subprocess.check_output(
                  [
                      "yt-dlp",
                      "--flat-playlist",
                      "--playlist-end", "1",
                      "--print", "id",
                      "--no-warnings",
                      CHANNEL_URL,
                  ],
                  text=True,
                  timeout=90,
              ).strip().splitlines()[0]
          except Exception as exc:
              raise SystemExit(f"No pude detectar el último video de YouTube: {exc}")

          if not re.fullmatch(r"[A-Za-z0-9_-]{11}", latest_id):
              raise SystemExit(f"ID de video inválido recibido: {latest_id!r}")

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          pattern = r"const channelVideos = \[(.*?)\];"
          match = re.search(pattern, text)
          if not match:
              raise SystemExit("No encontré channelVideos en index.html.")

          current = re.findall(r"'([^']+)'", match.group(1))
          videos = [latest_id] + [v for v in current if v != latest_id]
          videos = videos[:12]

          replacement = "const channelVideos = [" + ",".join(repr(v) for v in videos) + "];"
          new_text = text[:match.start()] + replacement + text[match.end():]

          if new_text != text:
              path.write_text(new_text, encoding="utf-8")
              print(f"Nuevo video detectado: {latest_id}")
          else:
              print(f"Sin cambios. Último video: {latest_id}")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update latest YouTube video"
          git push
